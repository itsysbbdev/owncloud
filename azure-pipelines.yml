trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAndValidate
  displayName: 'Terraform Validate & Plan'
  jobs:
  - job: TerraformJob
    displayName: 'Terraform Init & Plan'
    steps:
    - task: TerraformCLI@0
      displayName: 'Terraform Init'
      inputs:
        command: 'init'
        workingDirectory: 'configs/terraform'
        backendType: 'azurerm'
        backendServiceArm: 'github-sc-owncloud'
        ensureBackend: true

    - task: TerraformCLI@0
      displayName: 'Terraform Plan'
      inputs:
        command: 'plan'
        workingDirectory: 'configs/terraform'
        environmentServiceName: 'github-sc-owncloud'

- stage: Deploy
  displayName: 'Deploy Infrastructure'
  dependsOn: BuildAndValidate
  condition: succeeded()
  jobs:
  - job: ApplyJob
    displayName: 'Terraform Apply'
    steps:
    - task: TerraformCLI@0
      displayName: 'Terraform Init'
      inputs:
        command: 'init'
        workingDirectory: 'configs/terraform'
        backendType: 'azurerm'
        backendServiceArm: 'github-sc-owncloud'

    - task: TerraformCLI@0
      displayName: 'Terraform Apply'
      inputs:
        command: 'apply'
        workingDirectory: 'configs/terraform'
        environmentServiceName: 'github-sc-owncloud'
