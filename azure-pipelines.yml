trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

# Forced update to ensure Azure DevOps picks up the correct azure-rm-sc service connection
steps:
- task: AzureCLI@2
  displayName: 'Terraform Init, Plan & Apply'
  inputs:
    azureSubscription: 'azure-rm-sc'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      cd configs/terraform
      terraform init
      terraform plan -out=tfplan
      terraform apply -input=false tfplan
