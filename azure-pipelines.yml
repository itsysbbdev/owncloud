trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Validate
  displayName: 'Terraform Format & Validate'
  jobs:
  - job: TerraformValidate
    displayName: 'Validate Terraform Code'
    steps:
    - script: |
        cd configs/terraform
        terraform init -backend=false
        terraform fmt -check
        terraform validate
      displayName: 'Run Terraform Init (local) & Validate'
