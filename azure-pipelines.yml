trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: ValidateAndPlan
    displayName: 'Terraform Plan Stage'
    jobs:
      - job: TerraformPlan
        displayName: 'Run Terraform Plan'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: 'github-sc-owncloud'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Running Terraform validation..."
                cd configs/terraform
                terraform init
                terraform plan -out=tfplan
